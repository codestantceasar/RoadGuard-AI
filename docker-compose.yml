services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    container_name: roadguard-nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    build: .
    container_name: roadguard-dashboard
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://nginx:8000
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/processed:/app/data/processed:ro
      - ./data/raw:/app/data/raw:ro
      - ./data/external:/app/data/external:ro
      - ./outputs/retraining:/app/outputs/retraining
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  locust:
    build: .
    container_name: roadguard-locust
    command: >
      locust -f /app/locust/locustfile.py
      --host http://nginx:8000
      --web-host 0.0.0.0
      --web-port 8089
    ports:
      - "8089:8089"
    depends_on:
      nginx:
        condition: service_healthy
    profiles:
      - loadtest
